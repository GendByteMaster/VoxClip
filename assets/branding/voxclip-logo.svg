<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>VoxClip logo</title>
  <desc>Transparent VoxClip mark combining copied text, a document, and a speech waveform.</desc>

  <defs>
    <linearGradient id="frameGradient" x1="150" y1="132" x2="868" y2="884" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1177FF"/>
      <stop offset="0.52" stop-color="#0B7CFF"/>
      <stop offset="1" stop-color="#18D5E8"/>
    </linearGradient>

    <linearGradient id="paperGradient" x1="318" y1="204" x2="650" y2="754" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.64" stop-color="#F5F9FF"/>
      <stop offset="1" stop-color="#E5F0FF"/>
    </linearGradient>

    <linearGradient id="foldGradient" x1="588" y1="194" x2="745" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F71FF"/>
      <stop offset="1" stop-color="#17D7E8"/>
    </linearGradient>

    <linearGradient id="bubbleGradient" x1="552" y1="425" x2="878" y2="779" gradientUnits="userSpaceOnUse">
      <stop stop-color="#19D6E8"/>
      <stop offset="0.36" stop-color="#0C8CFF"/>
      <stop offset="1" stop-color="#2447F5"/>
    </linearGradient>

    <linearGradient id="motionGradient" x1="268" y1="604" x2="565" y2="604" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17D7E8"/>
      <stop offset="1" stop-color="#1177FF"/>
    </linearGradient>

    <filter id="documentShadow" x="248" y="148" width="586" height="682" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#082451" flood-opacity="0.14"/>
    </filter>

    <filter id="bubbleShadow" x="466" y="360" width="494" height="518" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0A3A9B" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- Copy / selection frame. Large gaps keep the mark readable at app-icon sizes. -->
  <g stroke="url(#frameGradient)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round">
    <path d="M180 310V210C180 177 207 150 240 150H340"/>
    <path d="M684 150H784C817 150 844 177 844 210V310"/>
    <path d="M180 714V814C180 847 207 874 240 874H340"/>
    <path d="M684 874H784C817 874 844 847 844 814V714"/>
  </g>

  <!-- Document -->
  <g filter="url(#documentShadow)">
    <path d="M304 254C304 215 335 184 374 184H596L734 322V700C734 739 703 770 664 770H374C335 770 304 739 304 700V254Z" fill="url(#paperGradient)"/>
    <path d="M596 184L734 322H654C622 322 596 296 596 264V184Z" fill="url(#foldGradient)"/>

    <path d="M382 354H536" stroke="#6DAAF4" stroke-width="28" stroke-linecap="round"/>
    <path d="M382 420H566" stroke="#6DAAF4" stroke-width="28" stroke-linecap="round"/>
    <path d="M382 486H512" stroke="#6DAAF4" stroke-width="28" stroke-linecap="round"/>
  </g>

  <!-- Fast copy / text-to-speech hand-off -->
  <g stroke="url(#motionGradient)" stroke-linecap="round">
    <path d="M268 586H522" stroke-width="32"/>
    <path d="M318 646H490" stroke-width="26"/>
    <path d="M358 700H458" stroke-width="22"/>
  </g>

  <!-- Speech / TTS surface -->
  <g filter="url(#bubbleShadow)">
    <path d="M526 480C526 429 567 388 618 388H786C837 388 878 429 878 480V662C878 713 837 754 786 754H707L622 830L642 754H618C567 754 526 713 526 662V480Z" fill="url(#bubbleGradient)"/>
    <path d="M526 480C526 429 567 388 618 388H786C837 388 878 429 878 480V662C878 713 837 754 786 754H707L622 830L642 754H618C567 754 526 713 526 662V480Z" stroke="white" stroke-opacity="0.16" stroke-width="4"/>
  </g>

  <!-- Voice waveform -->
  <g fill="white">
    <rect x="598" y="554" width="28" height="94" rx="14"/>
    <rect x="651" y="500" width="32" height="202" rx="16"/>
    <rect x="708" y="462" width="36" height="278" rx="18"/>
    <rect x="769" y="510" width="32" height="182" rx="16"/>
    <rect x="824" y="561" width="28" height="80" rx="14"/>
  </g>
</svg>
